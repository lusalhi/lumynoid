<rect width="1600" height="740" fill="#fff"/>
<text class="t" x="40" y="50">Lumynoid — sketsa flat &amp; minimal, tanpa huruf</text>
<text class="s" x="40" y="76">Hitam = warna utama, biru = warna aksen (contoh). Tiap sel: bentuk besar, versi putih di ubin gelap, versi dua warna, lalu 28 px dan 16 px.</text>
<g stroke="#E6E8EE"><path d="M0,90H1600M0,400H1600M400,90V720M800,90V720M1200,90V720"/></g>

<!-- A -->
