<style>
text{font-family:"Segoe UI",system-ui,sans-serif}
.t{font-size:30px;font-weight:600;fill:#111}
.s{font-size:16px;fill:#555}
.k{font-size:26px;font-weight:600;fill:#111}
.n{font-size:17px;fill:#333}
.d{font-size:14px;fill:#777}
