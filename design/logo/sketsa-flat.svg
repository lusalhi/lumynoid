<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1090" viewBox="0 0 1500 1090">
<title>Lumynoid — sketsa flat &amp; minimal</title>
<defs>
<symbol id="a" viewBox="0 0 100 100"><g fill="currentColor">
<rect x="15" y="17" width="30" height="30" fill="var(--ac)"/>
<rect x="15" y="55" width="30" height="30"/>
<rect x="53" y="55" width="30" height="30"/>
</g></symbol>
<symbol id="b" viewBox="0 0 100 100"><path fill="currentColor" d="M19,36L45,10L45,64L83,64L57,90L19,90Z"/></symbol>
<symbol id="c" viewBox="0 0 100 100"><g fill="currentColor">
<path d="M22,8V68H60" fill="none" stroke="currentColor" stroke-width="16"/>
<path d="M54,44L86,68L54,92Z"/>
</g></symbol>
<symbol id="d" viewBox="0 0 100 100"><g fill="currentColor">
<path d="M32,12H52V60H88V68A20,20 0 0 1 68,88H32A20,20 0 0 1 12,68V32A20,20 0 0 1 32,12Z"/>
<path d="M60,12H68A20,20 0 0 1 88,32V52H60Z" fill="var(--ac)"/>
</g></symbol>
<symbol id="e" viewBox="0 0 100 100"><g fill="currentColor">
<path fill-rule="evenodd" d="M26,0H74A26,26 0 0 1 100,26V74A26,26 0 0 1 74,100H26A26,26 0 0 1 0,74V26A26,26 0 0 1 26,0ZM30,26H46V58H70V74H30Z"/>
<rect x="54" y="26" width="16" height="16" fill="var(--ac)"/>
</g></symbol>
<symbol id="f" viewBox="0 0 100 100"><g fill="currentColor">
<path d="M22,8H38V58A12,12 0 0 0 62,58V40H78V58A28,28 0 0 1 22,58Z"/>
<circle cx="50" cy="46" r="9" fill="var(--ac)"/>
</g></symbol>
<symbol id="g" viewBox="0 0 100 100"><g fill="currentColor">
<path d="M20,10H46V60.5L20,86.5Z"/>
<path d="M49,62H84V88H23Z" fill="var(--ac)"/>
</g></symbol>
<symbol id="h" viewBox="0 0 100 100"><g fill="currentColor">
<path d="M16,26a13,13 0 0 1 26,0V55Q42,61 48,61H68a13,13 0 0 1 0,26H29a13,13 0 0 1-13,-13Z"/>
<rect x="54" y="20" width="26" height="26" rx="7" fill="var(--ac)"/>
</g></symbol>
<symbol id="i" viewBox="0 0 100 100"><path d="M25,16V48A34,34 0 0 0 59,82H80" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round"/></symbol>
</defs>
<style>
text{font-family:"Segoe UI",system-ui,sans-serif}
.t{font-size:30px;font-weight:600;fill:#111}
.s{font-size:16px;fill:#555}
.k{font-size:26px;font-weight:600;fill:#111}
.n{font-size:17px;fill:#333}
.d{font-size:14px;fill:#777}
</style>
<rect width="1500" height="1090" fill="#fff"/>
<text class="t" x="40" y="50">Lumynoid — sketsa flat &amp; minimal</text>
<text class="s" x="40" y="76">Hitam = warna utama, biru = warna aksen (contoh). Tiap sel: bentuk besar, versi putih di ubin gelap, versi dua warna, lalu 32 px dan 16 px.</text>
<g stroke="#E6E8EE"><path d="M0,100H1500M0,430H1500M0,760H1500M500,100V1090M1000,100V1090"/></g>

<!-- A -->
<use href="#a" x="30" y="130" width="190" height="190" color="#111" style="--ac:#111"/>
<rect x="270" y="118" width="210" height="150" rx="18" fill="#111"/>
<use href="#a" x="315" y="133" width="120" height="120" color="#fff" style="--ac:#fff"/>
<rect x="270" y="284" width="210" height="110" rx="18" fill="#F3F4F8"/>
<use href="#a" x="295" y="289" width="100" height="100" color="#111" style="--ac:#3A5BF0"/>
<use href="#a" x="418" y="304" width="32" height="32" color="#111" style="--ac:#111"/>
<use href="#a" x="424" y="356" width="16" height="16" color="#111" style="--ac:#111"/>
<text class="k" x="30" y="360">A</text><text class="n" x="66" y="360">L blok</text><text class="d" x="66" y="382">tiga kotak membentuk L</text>

<!-- B -->
<use href="#b" x="530" y="130" width="190" height="190" color="#111" style="--ac:#111"/>
<rect x="770" y="118" width="210" height="150" rx="18" fill="#111"/>
<use href="#b" x="815" y="133" width="120" height="120" color="#fff" style="--ac:#fff"/>
<rect x="770" y="284" width="210" height="110" rx="18" fill="#F3F4F8"/>
<use href="#b" x="795" y="289" width="100" height="100" color="#111" style="--ac:#3A5BF0"/>
<use href="#b" x="918" y="304" width="32" height="32" color="#111" style="--ac:#111"/>
<use href="#b" x="924" y="356" width="16" height="16" color="#111" style="--ac:#111"/>
<text class="k" x="530" y="360">B</text><text class="n" x="566" y="360">L sinar</text><text class="d" x="566" y="382">pita L dengan potongan 45°</text>

<!-- C -->
<use href="#c" x="1030" y="130" width="190" height="190" color="#111" style="--ac:#111"/>
<rect x="1270" y="118" width="210" height="150" rx="18" fill="#111"/>
<use href="#c" x="1315" y="133" width="120" height="120" color="#fff" style="--ac:#fff"/>
<rect x="1270" y="284" width="210" height="110" rx="18" fill="#F3F4F8"/>
<use href="#c" x="1295" y="289" width="100" height="100" color="#111" style="--ac:#3A5BF0"/>
<use href="#c" x="1418" y="304" width="32" height="32" color="#111" style="--ac:#111"/>
<use href="#c" x="1424" y="356" width="16" height="16" color="#111" style="--ac:#111"/>
<text class="k" x="1030" y="360">C</text><text class="n" x="1066" y="360">L panah</text><text class="d" x="1066" y="382">L yang jadi panah "lanjut"</text>

<!-- D -->
<use href="#d" x="30" y="460" width="190" height="190" color="#111" style="--ac:#111"/>
<rect x="270" y="448" width="210" height="150" rx="18" fill="#111"/>
<use href="#d" x="315" y="463" width="120" height="120" color="#fff" style="--ac:#fff"/>
<rect x="270" y="614" width="210" height="110" rx="18" fill="#F3F4F8"/>
<use href="#d" x="295" y="619" width="100" height="100" color="#111" style="--ac:#3A5BF0"/>
<use href="#d" x="418" y="634" width="32" height="32" color="#111" style="--ac:#111"/>
<use href="#d" x="424" y="686" width="16" height="16" color="#111" style="--ac:#111"/>
<text class="k" x="30" y="690">D</text><text class="n" x="66" y="690">Kotak terbelah</text><text class="d" x="66" y="712">L sebagai celah di dalam kotak</text>

<!-- E -->
<use href="#e" x="530" y="460" width="190" height="190" color="#111" style="--ac:#111"/>
<rect x="770" y="448" width="210" height="150" rx="18" fill="#111"/>
<use href="#e" x="815" y="463" width="120" height="120" color="#fff" style="--ac:#fff"/>
<rect x="770" y="614" width="210" height="110" rx="18" fill="#F3F4F8"/>
<use href="#e" x="795" y="619" width="100" height="100" color="#111" style="--ac:#3A5BF0"/>
<use href="#e" x="918" y="634" width="32" height="32" color="#111" style="--ac:#111"/>
<use href="#e" x="924" y="686" width="16" height="16" color="#111" style="--ac:#111"/>
<text class="k" x="530" y="690">E</text><text class="n" x="566" y="690">Ubin L</text><text class="d" x="566" y="712">L dilubangkan dari ubin, langsung jadi ikon</text>

<!-- F -->
<use href="#f" x="1030" y="460" width="190" height="190" color="#111" style="--ac:#111"/>
<rect x="1270" y="448" width="210" height="150" rx="18" fill="#111"/>
<use href="#f" x="1315" y="463" width="120" height="120" color="#fff" style="--ac:#fff"/>
<rect x="1270" y="614" width="210" height="110" rx="18" fill="#F3F4F8"/>
<use href="#f" x="1295" y="619" width="100" height="100" color="#111" style="--ac:#3A5BF0"/>
<use href="#f" x="1418" y="634" width="32" height="32" color="#111" style="--ac:#111"/>
<use href="#f" x="1424" y="686" width="16" height="16" color="#111" style="--ac:#111"/>
<text class="k" x="1030" y="690">F</text><text class="n" x="1066" y="690">Saku</text><text class="d" x="1066" y="712">gabungan l + u, dengan titik cahaya</text>

<!-- G -->
<use href="#g" x="30" y="790" width="190" height="190" color="#111" style="--ac:#111"/>
<rect x="270" y="778" width="210" height="150" rx="18" fill="#111"/>
<use href="#g" x="315" y="793" width="120" height="120" color="#fff" style="--ac:#fff"/>
<rect x="270" y="944" width="210" height="110" rx="18" fill="#F3F4F8"/>
<use href="#g" x="295" y="949" width="100" height="100" color="#111" style="--ac:#3A5BF0"/>
<use href="#g" x="418" y="964" width="32" height="32" color="#111" style="--ac:#111"/>
<use href="#g" x="424" y="1016" width="16" height="16" color="#111" style="--ac:#111"/>
<text class="k" x="30" y="1020">G</text><text class="n" x="66" y="1020">L miring</text><text class="d" x="66" y="1042">dua warna, dipotong diagonal di sudut</text>

<!-- H -->
<use href="#h" x="530" y="790" width="190" height="190" color="#111" style="--ac:#111"/>
<rect x="770" y="778" width="210" height="150" rx="18" fill="#111"/>
<use href="#h" x="815" y="793" width="120" height="120" color="#fff" style="--ac:#fff"/>
<rect x="770" y="944" width="210" height="110" rx="18" fill="#F3F4F8"/>
<use href="#h" x="795" y="949" width="100" height="100" color="#111" style="--ac:#3A5BF0"/>
<use href="#h" x="918" y="964" width="32" height="32" color="#111" style="--ac:#111"/>
<use href="#h" x="924" y="1016" width="16" height="16" color="#111" style="--ac:#111"/>
<text class="k" x="530" y="1020">H</text><text class="n" x="566" y="1020">L + kotak</text><text class="d" x="566" y="1042">huruf L bulat, satu kotak aksen</text>

<!-- I -->
<use href="#i" x="1030" y="790" width="190" height="190" color="#111" style="--ac:#111"/>
<rect x="1270" y="778" width="210" height="150" rx="18" fill="#111"/>
<use href="#i" x="1315" y="793" width="120" height="120" color="#fff" style="--ac:#fff"/>
<rect x="1270" y="944" width="210" height="110" rx="18" fill="#F3F4F8"/>
<use href="#i" x="1295" y="949" width="100" height="100" color="#111" style="--ac:#3A5BF0"/>
<use href="#i" x="1418" y="964" width="32" height="32" color="#111" style="--ac:#111"/>
<use href="#i" x="1424" y="1016" width="16" height="16" color="#111" style="--ac:#111"/>
<text class="k" x="1030" y="1020">I</text><text class="n" x="1066" y="1020">L lengkung</text><text class="d" x="1066" y="1042">satu goresan, sudut membulat</text>
</svg>
