<text class="t" x="40" y="50">Lumynoid — C Api-bot, varian warna</text>
<text class="s" x="40" y="76">Bentuknya sama semua, hanya warnanya yang berubah. Semua flat, tanpa gradien. Tiap baris: ikon di ubin gelap, ikon di ubin terang, ukuran kecil, lalu kode warnanya.</text>
