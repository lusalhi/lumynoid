# Epic Lumynoid v1, urutan build. Satu app Android = satu batas deploy, jadi epic dipotong per kemampuan.
# Setiap epic merilis APK ke GitHub Releases.

[[epic]]
id = 1
slug = "epic-chat-dan-provider"
title = "Orang awam chat dengan AI memakai key sendiri"
description = "Repo publik berlisensi, CI, dan rilis APK bertanda tangan di GitHub Releases berjalan; nama package `dev.lusalhi.lumynoid` dan kunci tanda tangan terdaftar di verifikasi developer Android; penguji memasang APK, menambah provider (preset OpenAI-compatible, URL custom, atau Anthropic), mengetes koneksinya, lalu chat dengan jawaban streaming ber-markdown dan daftar percakapan yang bisa dilanjutkan. Setiap pesan chat berjalan lewat kerangka TaskRunner (tanpa tool) yang di-host AgentService (FGS) dan tercatat di event log, sehingga epic 2 dan 3 memakai jalur yang sama (AD-2). Bagian R1 di sini: dari pemasangan sampai jawaban chat pertama hanya lewat layar app."
covers = ["R1", "R2", "R3"]

[[epic]]
id = 2
slug = "epic-agent-shell"
title = "Agent mengerjakan tugas coding di HP"
description = "Agent memakai tool coding untuk menulis file proyek, memasang paket npm lokal terverifikasi, dan menjalankan skrip bawaan aplikasi. PRoot berjalan sesuai kebutuhan dalam satu APK. TaskRunner dan AgentService menjalankan tugas lewat FGS, membuat event kartu dan log, serta menunggu persetujuan untuk aksi berisiko. Pengguna bisa mempratinjau file/HTML. Registry dan gerbang tool menjadi kontrak untuk epic berikutnya. Output tool tidak dapat melewati kartu konfirmasi."
covers = ["R4", "R8", "R9", "R10", "R11"]
after = [{ epic = 1, needs = "kerangka TaskRunner + AgentService dengan event log, adapter provider, dan layar chat streaming tempat kartu tampil" }]

[[epic]]
id = 8
slug = "epic-projects"
title = "Pengguna melanjutkan proyek dari beberapa percakapan"
description = "Di APK bertanda tangan setelah Epic 2, chat dalam proyek bernama berbagi file, paket lokal, dan instruksi, tetapi bukan riwayat atau log; chat biasa tetap tersedia. Setelah konfirmasi, hapus chat menyisakan data proyek, sementara hapus proyek membersihkan datanya saja. Upgrade memakai workspace, paket, log, dan artefak yang sudah dirilis Epic 2 tanpa menyalin data; chat dan pratinjau lama tetap dapat dibuka, dan chat tanpa workspace tetap biasa. Epic ini menetapkan identitas dan siklus hapus proyek yang akan dipakai Tugas Terjadwal; integrasi pembatalan jadwal dikerjakan di Epic 3. Sumber instruksi proyek dan batas riwayat diteruskan ke Hemat Kuota."
covers = ["R13"]
after = [{ epic = 2, needs = "workspace, artefak/log, dan APK bertanda tangan Epic 2 sebagai baseline migrasi" }]

[[epic]]
id = 3
slug = "epic-tugas-terjadwal"
title = "Tugas terjadwal jalan tepat waktu saat app tertutup"
description = "Pengguna membuat tugas sekali atau berulang lewat chat atau layar tugas; exact alarm memanggil TaskRunner tanpa mengubah loop-nya. Hasil muncul sebagai notifikasi dan di percakapan. Epic ini mengikat jadwal serta hasilnya ke proyek asal dan memasang pembatalan ketika proyek dihapus. Onboarding pengecualian baterai dan panduan autostart tersedia; uji 7 hari di Xiaomi dan Samsung lulus."
covers = ["R6"]
after = [
  { epic = 2, needs = "loop tool call dan gerbang konfirmasi di TaskRunner, agar tugas agent berjalan di AgentService tanpa layar chat terbuka" },
  { epic = 8, needs = "keanggotaan proyek dan batas penghapusan untuk tugas terjadwal" },
]

[[epic]]
id = 4
slug = "epic-hemat-kuota"
title = "Tugas tetap selesai dengan kuota API gratis"
description = "Saat key/provider kena limit, key/provider berikutnya dipakai; tugas agent hanya memakai model yang mendukung tools; sisa kuota dan status provider terlihat. Pemangkasan menjaga instruksi proyek dan batas riwayat per chat, serta memberi titik sambung untuk memotong output tool panjang (epic 5) dan memuat instruksi skill tanpa terpangkas (epic 6)."
covers = ["R12"]
after = [
  { epic = 2, needs = "loop agent tempat rotasi, filter model, dan pemangkasan konteks dipasang" },
  { epic = 8, needs = "sumber instruksi proyek dan batas riwayat per percakapan untuk pemangkasan" },
]

[[epic]]
id = 5
slug = "epic-browsing-web"
title = "Agent mencari dan membaca web untuk menjawab"
description = "Agent memanggil tool cari dan baca halaman lewat registry tool epic 2, isi halaman panjang dipotong lewat titik sambung konteks epic 4, dan jawaban menyertakan sumber yang bisa dibuka pengguna. Bagian R10 di sini: instruksi di halaman web diperlakukan sebagai data, dan halaman uji prompt injection tidak memicu aksi tanpa konfirmasi."
covers = ["R5", "R10"]
after = [
  { epic = 2, needs = "registry tool, kartu aktivitas, dan gerbang konfirmasi" },
  { epic = 4, needs = "titik sambung konteks untuk memotong isi halaman web panjang" },
]

[[epic]]
id = 6
slug = "epic-skill-pihak-ketiga"
title = "Pengguna memasang skill pihak ketiga"
description = "Pengguna memasang dan memakai skill berformat SKILL.md. Instruksi skill dimuat lewat titik sambung konteks epic 4. Epic ini membuktikan batas eksekusi CLI skill sebelum Binance Agentic Wallet (baw) dapat dipasang lewat npm dan dipakai. Login lewat kode pairing, lalu transaksi berhenti di preview sampai pengguna mengonfirmasi execute."
covers = ["R7"]
after = [
  { epic = 2, needs = "siklus hidup userland PRoot, registry tool, dan kartu konfirmasi untuk aksi keuangan" },
  { epic = 4, needs = "titik sambung konteks untuk memuat instruksi skill tanpa terpangkas" },
]

[[epic]]
id = 7
slug = "epic-rilis-publik"
title = "Lumynoid v1 terbit untuk umum"
description = "Penguji awam menyelesaikan chat, tugas lewat tool coding di proyek, jawaban web, dan tugas terjadwal tanpa terminal atau dokumentasi. Rilis publik mengulang uji upgrade yang mempertahankan data serta alur dua chat yang berbagi file tanpa mengakses riwayat chat lain atau workspace proyek lain. Rilis v1 sebagai APK bertanda tangan di GitHub Releases; epic ini menguji integrasi, bukan mengimplementasikan Projects."
covers = ["R1"]
after = [
  { epic = 8, needs = "Projects lulus uji migrasi dan alur dua chat untuk sesi penguji awam" },
  { epic = 3, needs = "tugas terjadwal yang lulus uji 7 hari, untuk sesi penguji awam" },
  { epic = 4, needs = "rotasi kuota, agar penguji awam bisa memakai key gratis" },
  { epic = 5, needs = "browsing web, untuk sesi penguji awam" },
  { epic = 6, needs = "skill pihak ketiga, untuk set fitur v1 yang lengkap sebelum rilis v1" },
]
