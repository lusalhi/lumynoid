description = "Proyeksikan semua panggilan dan statusnya, termasuk ditolak/gagal, dari event log dan blob store 2.2. Ikat pembersihan blob/workspace ke ConversationPort.delete, termasuk perlindungan saat queued, running, atau menunggu approval. Berikan referensi artefak persisten untuk 2.10."
