risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Hapus proyek membatalkan jadwalnya"
description = "Di dalam gerbang penghapusan `ProjectPort.delete`, nonaktifkan semua jadwal proyek dan batalkan alarmnya, lalu hapus jadwal itu sebelum percakapan hasilnya dibersihkan; cleanup tidak terhalang aturan rujukan percakapan hasil dari 3.3; penghapusan tidak selesai bila langkah ini gagal dan dapat diulang. Pembuatan jadwal dan pemasangan ulang alarm (3.2) memakai gerbang lifecycle target, dan fire memeriksa jadwal masih ada serta target aktif saat tugas diterima."
verify = "Buat dua jadwal untuk Project A dan satu untuk Project B, lalu hapus Project A: jadwal A hilang dari layar dan alarmnya tidak lagi terdaftar (`dumpsys alarm`), jadwal B tetap. Tes JVM: penghapusan yang terputus setelah `DELETING` diulang sampai selesai; jadwal baru dan pemasangan ulang untuk proyek yang sedang dihapus ditolak; alarm basi yang fire tidak membuat tugas."
references = ["_bmad-output/initiative-lumynoid/architecture-lumynoid/architecture-lumynoid.md#ad-27--project-memiliki-workspace-percakapan-memiliki-riwayat"]
covers = ["R5"]
