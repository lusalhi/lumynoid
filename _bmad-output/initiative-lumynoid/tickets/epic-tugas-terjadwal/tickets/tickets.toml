[[entry]]
id = 7
type = "story"
title = "Onboarding izin, baterai, dan autostart untuk jadwal"
description = "Saat jadwal pertama dibuat dari layar atau dari chat (3.4), minta izin notifikasi dan izin alarm tepat waktu. Selama izin alarm tepat waktu ditolak, jadwal tampil sebagai dijeda dengan tombol ke Pengaturan dan dipasang ulang otomatis lewat 3.2 setelah izin diberikan. Tambahkan permintaan pengecualian optimasi baterai dan panduan autostart statis untuk Xiaomi/Redmi/POCO, Samsung, Oppo/Realme/OnePlus, Vivo, dan panduan umum, dengan tombol ke halaman pengaturan bila tersedia."
verify = "Di emulator API 34+ dengan izin alarm dicabut, jadwal baru tampil dijeda dan tidak berjalan; memberi izin di Pengaturan membuatnya aktif dengan waktu berikutnya tanpa membuka form lagi. Dialog izin notifikasi muncul saat jadwal pertama dibuat. Layar panduan menampilkan teks merek sesuai `Build.MANUFACTURER` dan fallback umum; permintaan pengecualian baterai membuka dialog sistem."
references = ["_bmad-output/initiative-lumynoid/architecture-lumynoid/architecture-lumynoid.md#ad-24--batas-izin-dan-batas-produk"]
covers = ["R6"]
