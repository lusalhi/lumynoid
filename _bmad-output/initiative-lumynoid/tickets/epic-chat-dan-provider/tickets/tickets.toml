description = "Saat dibuka pertama kali tanpa provider, app membawa pengguna memilih provider, mengisi key, dan mengetes koneksi, lalu langsung ke percakapan baru; layar tanpa provider selalu menunjuk ke langkah itu; tidak ada langkah yang meminta terminal atau dokumentasi. Memakai layar provider story 4 dan 5, daftar percakapan story 7, dan APK rilis story 3."
