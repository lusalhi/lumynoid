name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Keep :core free of Android, Ktor and Room (AD-1)
        run: |
          ./gradlew -q :core:dependencies --configuration runtimeClasspath > core-deps.txt
          if grep -Ei 'android|ktor|room' core-deps.txt; then
            echo "::error::':core' must not depend on android, ktor or room"
            exit 1
          fi

      - name: JVM tests
        run: ./gradlew :core:test :llm:test :data:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: lumynoid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            llm/build/reports/tests
            data/build/reports/tests
