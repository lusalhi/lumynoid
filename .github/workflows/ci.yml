name: CI

on:
  # Branch pushes are covered by their pull request; only main builds on push.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04 # The rootfs build uses Noble's qemu-aarch64-static.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358'

      - name: Install rootfs build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Keep :core free of Android, Ktor and Room (AD-1)
        run: |
          ./gradlew -q :core:dependencies --configuration runtimeClasspath > core-deps.txt
          if grep -Ei 'android|ktor|room' core-deps.txt; then
            echo "::error::':core' must not depend on android, ktor or room"
            exit 1
          fi

      - name: Dependency policy self-test
        run: python3 .github/scripts/check_dependency_policy.py --self-test

      - name: No Google services, only OSI licences on the release classpath (AD-17)
        run: ./gradlew :app:checkDependencyPolicy

      - name: JVM tests (include the persisted-name check)
        run: ./gradlew :core:test :llm:test :data:testDebugUnitTest :app:testDebugUnitTest :userland:testDebugUnitTest

      - name: Build the debug and instrumentation APKs and pinned rootfs
        run: ./gradlew :app:assembleDebug :userland:assembleDebugAndroidTest :userland:buildUserlandRootfs

      - name: Verify debug APK and staged runtime archive
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk"
          python3 tools/userland/verify-apk.py "$apk" userland/build/userland/rootfs \
            --test-apk userland/build/outputs/apk/androidTest/debug/userland-debug-androidTest.apk

      - uses: actions/upload-artifact@v7
        with:
          name: lumynoid-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            userland/build/outputs/apk/androidTest/debug/*.apk
            userland/build/userland/rootfs/*
            userland/build/userland/native/sources/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            llm/build/reports/tests
            data/build/reports/tests
            app/build/reports/tests
            userland/build/reports/tests

  schema-claims:
    # One Room schema version, claimed once (AD-19). Needs the PR's own history, so it only runs on pull requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Schema claim self-test
        run: python3 .github/scripts/check_schema_claims.py --self-test

      - name: Reject reused or edited schema versions
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          python3 .github/scripts/check_schema_claims.py --base "origin/$BASE_REF" --repo "$REPO" --pr "$PR_NUMBER"
