name: Release

# AD-25: the only place a release APK is built or signed. Triggered by a `v*` tag, never by a pull request.
# Signing secrets exist only in the Environment `release` (tag rule `v*`, owner as required reviewer)
# and are used only by the `build` job, which runs after `verify` passes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    # No secrets here: tag rules, the CI gates and the tests.
    runs-on: ubuntu-24.04 # The rootfs build uses Noble's qemu-aarch64-static.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch main and every tag
        run: git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' '+refs/tags/*:refs/tags/*'

      - name: Tag still points at the commit this run was triggered for
        env:
          TAG: ${{ github.ref_name }}
        run: |
          actual="$(git rev-parse "$TAG^{commit}")"
          if [ "$actual" != "$GITHUB_SHA" ]; then
            echo "::error::tag $TAG now points at $actual but this run was triggered for $GITHUB_SHA; the tag moved"
            exit 1
          fi

      - name: Release check self-test
        run: python3 .github/scripts/check_release.py --self-test

      - name: Tag is on main, names the version, raises versionCode, keeps the schema line
        env:
          TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/check_release.py tag --tag "$TAG" --main origin/main

      - name: Backups stay off (AD-25)
        run: |
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml || { echo "::error::allowBackup must be false"; exit 1; }
          grep -q 'android:dataExtractionRules=' app/src/main/AndroidManifest.xml || { echo "::error::dataExtractionRules is missing"; exit 1; }

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358'

      - name: Install rootfs build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Keep :core free of Android, Ktor and Room (AD-1)
        run: |
          ./gradlew -q :core:dependencies --configuration runtimeClasspath > core-deps.txt
          if grep -Ei 'android|ktor|room' core-deps.txt; then
            echo "::error::':core' must not depend on android, ktor or room"
            exit 1
          fi

      - name: Dependency policy self-test
        run: python3 .github/scripts/check_dependency_policy.py --self-test

      - name: No Google services, only OSI licences on the release classpath (AD-17)
        run: ./gradlew :app:checkDependencyPolicy

      - name: JVM tests
        run: ./gradlew :core:test :llm:test :data:testDebugUnitTest :app:testDebugUnitTest

      - name: Build and stage the pinned rootfs
        run: ./gradlew :userland:buildUserlandRootfs

      - uses: actions/upload-artifact@v7
        with:
          name: userland-rootfs
          path: userland/build/userland/rootfs/*
          if-no-files-found: error

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358'

      - uses: actions/download-artifact@v7
        with:
          name: userland-rootfs
          path: runtime-dist

      - name: Build the signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          LUMYNOID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          LUMYNOID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          LUMYNOID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/release.p12"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          export LUMYNOID_KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
          ./gradlew :app:assembleRelease

      - name: Check the APK against the registered key and the source
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/37.0.0"
          apk="$(ls app/build/outputs/apk/release/*.apk)"
          test "$(echo "$apk" | wc -l)" = 1
          "$tools/zipalign" -c -P 16 4 "$apk"
          python3 tools/userland/verify-apk.py "$apk" runtime-dist
          "$tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          if grep -q 'application-debuggable' "$RUNNER_TEMP/badging.txt"; then
            echo "::error::the release APK is debuggable"
            exit 1
          fi
          python3 .github/scripts/check_release.py apk --certs "$RUNNER_TEMP/certs.txt" --badging "$RUNNER_TEMP/badging.txt"
          mkdir dist
          cp "$apk" "dist/lumynoid-$TAG.apk"
          cp runtime-dist/* userland/build/userland/native/sources/* dist/
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt
          fi
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
        env:
          TAG: ${{ github.ref_name }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    # No secrets: it only uploads what `build` produced.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in v0.*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes $flags
